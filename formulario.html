<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto</title>
    <!-- Enlace al archivo CSS externo requerido -->
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <main class="container">
        <h1>Contacto</h1>
        
        <!-- Formulario sin tablas y con validaciones nativas -->
        <form>
            <div class="form-group">
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" name="nombre" required>
            </div>

            <div class="form-group">
                <label for="correo">Correo electrónico</label>
                <input type="email" id="correo" name="correo" required>
            </div>

            <div class="form-group">
                <label for="telefono">Teléfono</label>
                <!-- Validación pattern para exactamente 10 dígitos -->
                <input type="tel" id="telefono" name="telefono" pattern="[0-9]{10}" placeholder="10 dígitos" required>
            </div>

            <div class="form-group">
                <label for="mensaje">Mensaje</label>
                <textarea id="mensaje" name="mensaje" rows="4" required></textarea>
            </div>

            <button type="submit">Enviar</button>
        </form>
    </main>

</body>
</html>
